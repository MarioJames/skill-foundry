interface:
  display_name: "Agent Conduct"
  short_description: "会话开始即按 MMDD｜TYPE｜Topic 命名（LobeHub 话题含任务调度、Codex 线程、Herdr 标签页）；约束报告、证据、临时目录、worktree、分支和 Docker 资源的落点与回收，收尾用只读扫描核对遗留；LobeHub 社区 PR 用 community-pr.ts 判定合并门槛并跟进到合并"
  default_prompt: "使用 $agent-conduct 在会话开始时命名当前会话，按约定位置存放报告和证据，任务收尾时扫描并回收本任务创建的临时环境，说明保留项的原因和释放条件。"

policy:
  allow_implicit_invocation: true
