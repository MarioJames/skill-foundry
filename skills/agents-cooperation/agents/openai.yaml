interface:
  display_name: "Agents Cooperation"
  short_description: "Owner 只设计、review 和调度，改动全部交给按本地配置选出的 worker（native 或 Herdr 拉起）；经 Herdr pane 与另一 owner 协作并交叉 review"
  default_prompt: "使用 $agents-cooperation 盘点全部未完成工作，判定讨论、并行开发或普通调度模式，owner 不亲自改文件；先 show 读取调度配置，拆包时为每个包定类别（mechanical / routine / judgment），派发前 resolve --class 取模型与方式（脚本据类别优先走免费 worker，judgment 包可带 --tag 按领域选，--worker 只用于用户指定或续接同一包），用内置子 agent 或 Herdr 新建 lane 执行，一次性包验收后关闭 lane，额度耗尽时 block 并改派；必要时经 Herdr pane 与另一 owner 协作和交叉 review，高风险（必审）方案经 ChatGPT 审查，其余方案由 owner 讨论后由接单 owner 冻结，轮次有界并写入 decision-log，并在每个触发点输出台账。"
policy:
  allow_implicit_invocation: true
