interface:
  display_name: "Agents Cooperation"
  short_description: "主模型自行判定讨论、并行开发或普通调度，经 Herdr pane 与另一主 Agent 协作并交叉 review"
  default_prompt: "使用 $agents-cooperation 盘点全部未完成工作，判定讨论、并行开发或普通调度模式，用内置子 Agent 执行，必要时经 Herdr pane 与另一主 Agent 协作和交叉 review，并在每个触发点输出台账。"
policy:
  allow_implicit_invocation: true
